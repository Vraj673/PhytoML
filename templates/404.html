{% extends "base.html" %}
{% block title %}{{ _('Page Not Found') }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-emoji-frown fs-1 text-secondary"></i>
    <h1 class="mt-3">{{ _('404 - Page Not Found') }}</h1>
    <p class="text-muted">{{ _("The page you're looking for doesn't exist.") }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-success">{{ _('Go Home') }}</a>
</div>
{% endblock %}
