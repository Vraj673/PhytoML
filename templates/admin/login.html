{% extends "base.html" %}
{% block title %}{{ _('Admin Login') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-4 text-dark"><i class="bi bi-shield-lock"></i> {{ _('Admin Login') }}</h3>
                <form method="POST" action="{{ url_for('admin.login') }}">
                    <div class="mb-3">
                        <label class="form-label">{{ _('Admin Username') }}</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('Password') }}</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">{{ _('Login as Admin') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
